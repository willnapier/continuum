[package]
name = "continuum-semantic-query"
version = "0.1.0"
edition = "2021"
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2.10", features = ["json"] }
unicode-normalization = "0.1"
continuum-mcp = { path = "../continuum-mcp" }
[dev-dependencies]
tempfile = "3"
